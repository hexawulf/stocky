# Automatic Claude review of pull requests.
# Based on anthropics/claude-code-action examples/pr-review-comprehensive.yml.
# Skips drafts and forks (the OAuth secret isn't available to fork PRs).
# A new push to the same PR cancels the review still running for the old head.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review with Claude
        uses: anthropics/claude-code-action@86d88e619d8e6caf07b5c3944dd14f441c533718 # v1.0.243
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request to Stocky, a self-hosted homelab hardware inventory.
            Stack: Vue 3 (<script setup>, scoped styles) + Vite frontend in src/; PocketBase
            backend with JS hooks in pb_hooks/ and migrations in pb_migrations/; Vitest tests
            (src/**/*.test.js, happy-dom) plus server suites in scripts/. spec.md is the
            source of truth for behaviour; CLAUDE.md lists the project rules.

            Focus on, in order:
            1. Bugs: logic errors, edge cases, broken loading/offline/error states, wrong
               quantity or movement handling (quantities 1-9,999, never negative; movements
               append-only and written only by server routes in one transaction).
            2. Security: PocketBase API rules (records scoped to @request.auth.id, no
               sign-up, server-owned fields not settable via the records API), untrusted
               snapshot input in pb_hooks, secrets or personal/fleet details committed
               (this is a public repo), anything VITE_* that would leak into the bundle.
            3. Migrations: released files in pb_migrations/ must never be edited; fixes go
               in a new migration.
            4. Missing tests: changes to pb_hooks, pb_migrations, src/stores or src/lib
               without matching tests; bug fixes without a regression test.
            5. Scoped-CSS class collisions: a child component's root element also receives
               the parent's scoped attribute, so a class name used in both parent and child
               scoped styles can style the child unexpectedly (the 0.1.2 import-screen bug).
               Flag generic class names shared across a parent and its child components.

            Keep it concise. Use inline comments for specific issues and one short top-level
            summary. Skip formatting and style nitpicks (Prettier handles them) and don't
            praise. If you find nothing worth raising, say so in one line.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
