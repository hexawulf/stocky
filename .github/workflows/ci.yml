# CI: unit and component tests, the production build, then the server suites
# against throwaway PocketBase instances (pinned release, checksum-verified).
# Also called by release.yml with the tag to test before publishing.
# No secrets are used here, so pull requests from forks run it safely.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git ref to test (release.yml passes refs/tags/vX.Y.Z)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node (from package.json engines)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Server suites (downloads and verifies the pinned PocketBase)
        run: scripts/test-api.sh --download

      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-api-log
          path: ~/logs/stocky-test-api_*.log
          if-no-files-found: ignore
          retention-days: 7
